<script>
(()=>{const root=document.currentScript.closest('.academy-hub');if(!root||root.dataset.ready)return;root.dataset.ready='1';const DB={"topics":[{"name":"地理：地図・気候・産業","summary":"地形・気候・人口・産業を地図や統計と結びつけて理解する。","remember":"統計は単位・年次・割合か実数かを確認する。","condition":"気候の理由は緯度・海流・標高・季節風など複数条件で考える。"},{"name":"歴史：時代・出来事","summary":"年代だけでなく背景・内容・影響のつながりで覚える。","remember":"年表に「原因→出来事→結果」を書いて整理する。","condition":"同じ時代の国内外の出来事や史料の作成時期を確認する。"},{"name":"公民：憲法・政治","summary":"憲法、三権分立、選挙、地方自治、人権を制度の役割で理解する。","remember":"国会＝立法、内閣＝行政、裁判所＝司法を基準に整理する。","condition":"多数決だけでなく基本的人権と少数者の尊重も考える。"},{"name":"公民：経済・社会","summary":"需要と供給、価格、税、社会保障、消費者、労働を整理する。","remember":"需要・供給のどちらが変化したか分けて考える。","condition":"社会保険と公的扶助、財政と金融など似た語を区別する。"},{"name":"資料・統計","summary":"グラフ・表・地図・史料のタイトル、単位、年次、出典を確認する。","remember":"資料の特徴を見つけ、本文や別資料と照合する。","condition":"相関があるだけで原因と結果を断定しない。"},{"name":"記述・説明問題","summary":"根拠となる資料と社会の仕組みを結びつけて説明する。","remember":"「資料の特徴＋理由＋結論」の順で書く。","condition":"資料にない情報を付け足さず、問いの条件を満たす。"}],"questions":[{"topic":"地理：地図・気候・産業","q":"統計資料を比較する前に確認するものは？","options":["タイトル・単位・年次","色だけ","文字の大きさ","ページ数"],"a":0,"ex":"タイトル、単位、年次、割合か実数かを確認する。"},{"topic":"地理：地図・気候・産業","q":"縮尺1:50,000の地図で4cmは実際に何km？","options":["0.2km","2km","20km","200km"],"a":1,"ex":"4cm×50,000=200,000cm=2km。"},{"topic":"歴史：時代・出来事","q":"歴史資料の信頼性を考える手がかりは？","options":["作成時期・目的・書き手","文字の色","長さだけ","現在の価値観だけ"],"a":0,"ex":"いつ誰が何のために作成したか考える。"},{"topic":"公民：憲法・政治","q":"日本国憲法の三つの基本原理に含まれるものは？","options":["国民主権","身分制度の固定","一部の人だけの参政権","議会の廃止"],"a":0,"ex":"国民主権、基本的人権の尊重、平和主義。"},{"topic":"公民：憲法・政治","q":"国の唯一の立法機関は？","options":["内閣","国会","裁判所","日本銀行"],"a":1,"ex":"国会は国の唯一の立法機関。"},{"topic":"公民：経済・社会","q":"需要が増え供給が変わらない場合、価格は一般に？","options":["上がる","下がる","必ずゼロ","必ず変わらない"],"a":0,"ex":"他の条件が一定なら需要増加は価格上昇の圧力になる。"},{"topic":"資料・統計","q":"相関関係がある2つのデータから必ず言えることは？","options":["一方が他方の原因","関連が見られる","値が一致する","片方が誤り"],"a":1,"ex":"相関だけでは因果関係があるとは限らない。"},{"topic":"歴史：時代・出来事","q":"【入試実戦】改革後に税収が変化した。原因を考えるには？","options":["改革だけが原因と断定","前後関係に加え制度や他の要因を確認","年号だけで判断","資料を読まない"],"a":1,"ex":"時間的な前後関係だけで原因とは断定できない。"}]},key='pass-academy-pass-juken-academy2026/junior-social-studies';let state={learned:[],review:[],answered:0,correct:0,stats:{}};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}let mock=[],mi=0,ma=0,mc=0;const $=(s,base=root)=>base.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}stats()}function stats(){$('[data-stat="learned"]').textContent=state.learned.length;$('[data-stat="accuracy"]').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'—';$('[data-stat="review"]').textContent=state.review.length;$('[data-stat="weak"]').textContent=Object.values(state.stats).filter(x=>x.total>=2&&x.correct/x.total<.7).length}function topic(){return DB.topics.find(t=>t.name===$('[data-topic]').value)||DB.topics[0]}function qs(){return DB.questions.filter(q=>q.topic===$('[data-topic]').value)}function cards(){let s=$('[data-search]').value.toLowerCase();$('[data-cards]').innerHTML=DB.topics.filter(t=>(t.name+t.summary).toLowerCase().includes(s)).map(t=>'<article class="card"><span class="tag">'+esc(t.name)+'</span><p>'+esc(t.summary)+'</p><button data-pick="'+esc(t.name)+'">この分野を学ぶ</button></article>').join('')||'<p>該当する分野がありません。</p>';$$('[data-pick]').forEach(b=>b.onclick=()=>{$('[data-topic]').value=b.dataset.pick;lesson();tab(1)})}function lesson(){let t=topic();$('[data-lesson]').innerHTML='<span class="tag">'+esc(t.name)+'</span><h3>要点・基礎知識</h3><p>'+esc(t.summary)+'</p><h3>覚え方・整理方法</h3><p>'+esc(t.remember)+'</p><h3>使う条件・注意点</h3><p>'+esc(t.condition)+'</p><button data-mark>この分野を学習済みにする ✓</button>'; $('[data-mark]').onclick=()=>{if(!state.learned.includes(t.name))state.learned.push(t.name);save();cards()};$('[data-tips]').innerHTML='<h3>解き方のコツ</h3><p>'+esc(t.remember)+'</p><h3>よくあるミス・条件</h3><p>'+esc(t.condition)+'</p><p>問題文の条件・単位・根拠を確認し、答えが条件に合うか見直しましょう。</p>'}function record(q,ok){state.answered++;if(ok)state.correct++;state.stats[q.topic]??={correct:0,total:0};state.stats[q.topic].total++;if(ok)state.stats[q.topic].correct++;if(!ok&&!state.review.includes(q.q))state.review.push(q.q);if(ok)state.review=state.review.filter(x=>x!==q.q);save()}function ask(box,q,next,label){let chosen=null,done=false;box.innerHTML='<span class="tag">'+esc(q.topic)+'</span><p class="muted">'+esc(label||'理解度チェック')+'</p><h3>'+esc(q.q)+'</h3><div class="choices"></div><div class="answer" data-fb>選択肢を選んで答え合わせしよう。</div>';const c=$('.choices',box);q.options.forEach((v,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>{if(done)return;chosen=i;$$('.choices button').forEach(x=>x.style.outline='');b.style.outline='2px solid #6ed8ff'};c.appendChild(b)});let b=document.createElement('button');b.className='primary';b.textContent='解答・解説を見る';b.onclick=()=>{if(done||chosen===null)return;done=true;let ok=chosen===q.a;record(q,ok);if(label&&label.startsWith('模擬テスト')&&ok)mc++;$('.choices button')[q.a].style.borderColor='#5ee0b5';if(!ok)$$('.choices button')[chosen].style.borderColor='#ff8794';$('[data-fb]',box).innerHTML='<b>'+(ok?'正解！':'不正解')+'</b><p>正解：'+esc(q.options[q.a])+'</p><p>'+esc(q.ex)+'</p>';b.disabled=true;let n=document.createElement('button');n.textContent='次へ';n.onclick=next;box.appendChild(n)};box.appendChild(b)}function tab(i){$$('[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===i));$$('[data-panel]').forEach(p=>p.classList.toggle('active',+p.dataset.panel===i));if(i===1)lesson();if(i===2)lesson();if(i===3)quick();if(i===4)app();if(i===5)data();if(i===6)weak();if(i===7)exam();if(i===8)reviews()}function quick(){let a=qs();if(!a.length){$('[data-quick]').textContent='この分野の問題は準備中です。';return}ask($('[data-quick]'),a[0],()=>ask($('[data-quick]'),a[(a.indexOf(a[0])+1)%a.length],quick,'基本問題'),'基本問題')}function app(){let q=DB.questions.find(q=>/【入試実戦】|【共テ風】/.test(q.q))||DB.questions[DB.questions.length-1];ask($('[data-app]'),q,app,'応用・入試実戦')}function data(){let q=DB.questions.find(q=>/資料|グラフ|統計|相関|条件|実験/.test(q.q))||DB.questions[0];ask($('[data-data]'),q,data,'資料・条件読解')}function exam(){let q=DB.questions.find(q=>/【入試実戦】|【共テ風】/.test(q.q))||DB.questions[0];ask($('[data-exam]'),q,exam,'入試・共テ型')}function weak(){let a=Object.entries(state.stats);$('[data-weaklist]').innerHTML=a.length?a.map(([k,v])=>{let p=Math.round(v.correct/v.total*100);return '<div class="card"><b>'+esc(k)+'</b> '+v.correct+'/'+v.total+'問（'+p+'%）<div class="progress"><span style="width:'+p+'%;background:'+(p<60?'#ff8794':p<80?'#ffd27a':'#5ee0b5')+'"></span></div></div>'}).join(''):'<p>まだ記録がありません。演習すると弱点を分析できます。</p>'}function start(){mock=[...DB.questions].sort(()=>Math.random()-.5).slice(0,Math.min(10,DB.questions.length));mi=0;ma=0;mc=0;nextMock()}function nextMock(){if(mi>=mock.length){$('[data-mock]').innerHTML='<h3>模擬テスト終了</h3><p>今回の正答率：'+Math.round(mc/Math.max(1,ma)*100)+'%（'+mc+'/'+ma+'）</p><button data-weaknow>分野別の弱点を見る</button>'; $('[data-weaknow]').onclick=weak;weak();return}let q=mock[mi];ask($('[data-mock]'),q,()=>{ma++;mi++;nextMock()},'模擬テスト '+(mi+1)+'/'+mock.length)}function reviews(){$('[data-reviews]').innerHTML=state.review.length?state.review.map(q=>{let item=DB.questions.find(x=>x.q===q);return '<article class="card"><p>'+esc(q)+'</p>'+(item?'<button data-rq="'+esc(q)+'">もう一度解く</button>':'')+'<button data-rm="'+esc(q)+'">リストから外す</button></article>'}).join(''):'<p>復習リストは空です。問題を間違えると自動で追加されます。</p>';$$('[data-rq]').forEach(b=>b.onclick=()=>{let q=DB.questions.find(x=>x.q===b.dataset.rq);if(q)ask($('[data-reviews]'),q,reviews,'復習問題')});$$('[data-rm]').forEach(b=>b.onclick=()=>{state.review=state.review.filter(x=>x!==b.dataset.rm);save();reviews()})}$$('[data-tab]').forEach(b=>b.onclick=()=>tab(+b.dataset.tab));$('[data-topic]').onchange=()=>{lesson();quick()};$('[data-search]').oninput=cards;$('[data-start]').onclick=start;$$('[data-weak]').forEach(b=>b.onclick=weak);$('[data-export]').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='study-record.json';a.click();URL.revokeObjectURL(u)};$('[data-reset]').onclick=()=>{if(confirm('学習記録をリセットしますか？')){state={learned:[],review:[],answered:0,correct:0,stats:{}};save();reviews();cards()}};cards();lesson();quick();weak();reviews();stats()})();
</script></section></body></html>
